name: Update flake.lock

# Manual only — never runs on push or pull_request. Exists specifically for
# cases where the lockfile bump itself is the thing under test (e.g. a PR
# that depends on a newer nixpkgs) and running it locally has proven
# unreliable — the update needs to happen, get committed, and get pushed in
# one atomic step, on the exact branch under review.
on:
  workflow_dispatch:
    inputs:
      input:
        description: "Flake input to update (blank updates every input, same as `nix flake update`)"
        required: false
        default: "nixpkgs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # FLAKE_INPUT is a free-text workflow_dispatch input, so it reaches the
      # script through the environment rather than `${{ }}` substitution into
      # the script text — the substitution happens before bash parses the line,
      # which makes any quote or metacharacter in the value part of the script.
      - name: update flake.lock
        env:
          FLAKE_INPUT: ${{ github.event.inputs.input }}
        run: |
          if [ -n "$FLAKE_INPUT" ]; then
            nix flake lock --update-input "$FLAKE_INPUT"
          else
            nix flake update
          fi

      - name: commit and push, if anything changed
        env:
          FLAKE_INPUT: ${{ github.event.inputs.input || 'all inputs' }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged, nothing to commit"
            exit 0
          fi
          git add flake.lock
          git commit -m "flake.lock: update $FLAKE_INPUT via workflow_dispatch"
          git push origin HEAD:"$TARGET_REF"
