name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# access-tokens authenticates the github: flake input fetcher (used for
# agenix) against api.github.com. Unauthenticated requests from shared GitHub
# Actions runner IPs get rate-limited/flaky far more often than this repo's
# own commit history suggested — dozens of runs failed on the exact same
# 503 before this was added. The default GITHUB_TOKEN is sufficient (read
# access to public repos only).
#
# Both jobs post a PR comment on failure via actions/github-script's
# issues.createComment (the API PR comments actually go through). The
# default GITHUB_TOKEN is read-only unless permissions are declared here,
# so without this the comment step itself 403s and the real failure output
# never reaches the PR — masked behind an unrelated HttpError instead.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: pre-commit
        id: precommit
        continue-on-error: true
        run: |
          set -o pipefail
          nix develop -c pre-commit run --all-files 2>&1 | tee /tmp/precommit-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.precommit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/precommit-output.txt')
              ? fs.readFileSync('/tmp/precommit-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: pre-commit failures\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if pre-commit failed
        if: steps.precommit.outcome == 'failure'
        run: exit 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enterprise-d's toplevel is a full GNOME desktop closure (Steam,
      # VS Code, Chrome, Discord, etc.). Confirmed live: building it
      # alongside holodeck-01 ran the runner out of disk mid-build
      # ("No space left on device", 53 MB free) — standard GitHub-hosted
      # runners ship several GB of preinstalled toolchains (.NET, GHC,
      # Android SDK, etc.) this workflow never uses, which free up enough
      # room to actually finish the build.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: flake check (eval only, all machines incl. aarch64)
        id: flakecheck
        continue-on-error: true
        run: |
          set -o pipefail
          nix flake check --no-build 2>&1 | tee /tmp/flakecheck-output.txt
          exit ${PIPESTATUS[0]}

      - name: build x86_64 machines (native)
        id: buildx8664
        if: steps.flakecheck.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            nix build .#nixosConfigurations.enterprise-d.config.system.build.toplevel --no-link &&
            nix build .#nixosConfigurations.holodeck-01.config.system.build.toplevel --no-link
          } 2>&1 | tee /tmp/build-output.txt
          exit ${PIPESTATUS[0]}

      # defiant (aarch64-linux) is intentionally not built here — cross-compiling
      # a full toplevel via QEMU emulation is slow on a shared runner, and the
      # flake check above already catches eval-time errors for it. Building it
      # for real still requires a native aarch64 machine or a remote builder.

      - name: Post failure comment
        if: (steps.flakecheck.outcome == 'failure' || steps.buildx8664.outcome == 'failure') && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(no output captured)'
            const output = '${{ steps.flakecheck.outcome }}' === 'failure'
              ? read('/tmp/flakecheck-output.txt')
              : read('/tmp/build-output.txt')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: build failures\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if flake check or build failed
        if: steps.flakecheck.outcome == 'failure' || steps.buildx8664.outcome == 'failure'
        run: exit 1
