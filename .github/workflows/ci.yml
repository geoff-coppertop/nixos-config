name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: pre-commit
        id: precommit
        continue-on-error: true
        run: |
          set -o pipefail
          nix develop -c pre-commit run --all-files 2>&1 | tee /tmp/precommit-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.precommit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/precommit-output.txt')
              ? fs.readFileSync('/tmp/precommit-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: pre-commit failures\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if pre-commit failed
        if: steps.precommit.outcome == 'failure'
        run: exit 1
