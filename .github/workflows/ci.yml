name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# access-tokens authenticates the github: flake input fetcher (used for
# agenix) against api.github.com. Unauthenticated requests from shared GitHub
# Actions runner IPs get rate-limited/flaky far more often than this repo's
# own commit history suggested — dozens of runs failed on the exact same
# 503 before this was added. The default GITHUB_TOKEN is sufficient (read
# access to public repos only).
#
# Every job posts a PR comment on failure via actions/github-script's
# issues.createComment (the API PR comments actually go through). The
# default GITHUB_TOKEN is read-only unless permissions are declared here,
# so without this the comment step itself 403s and the real failure output
# never reaches the PR — masked behind an unrelated HttpError instead.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: pre-commit
        id: precommit
        continue-on-error: true
        run: |
          set -o pipefail
          nix develop -c pre-commit run --all-files 2>&1 | tee /tmp/precommit-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.precommit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/precommit-output.txt')
              ? fs.readFileSync('/tmp/precommit-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: pre-commit failures\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if pre-commit failed
        if: steps.precommit.outcome == 'failure'
        run: exit 1

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: flake check (eval only, all machines incl. aarch64)
        id: flakecheck
        continue-on-error: true
        run: |
          set -o pipefail
          nix flake check --no-build 2>&1 | tee /tmp/flakecheck-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.flakecheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/flakecheck-output.txt')
              ? fs.readFileSync('/tmp/flakecheck-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: flake check failures\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if flake check failed
        if: steps.flakecheck.outcome == 'failure'
        run: exit 1

  # Which hosts actually need rebuilding, decided by diffing each host's
  # toplevel derivation between the base and head commit. fetch-depth: 0 is
  # required — the script checks out the base commit to evaluate it. See
  # tools/ci_changed_hosts.py for how the decision is made and where it
  # deliberately fails safe.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: detect hosts whose toplevel changed
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          matrix=$(python3 tools/ci_changed_hosts.py --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "matrix=$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each machine is built natively, one per job so every host gets its own
  # runner disk instead of sharing one across sequential builds. Confirmed
  # live: enterprise-d's toplevel is a full GNOME desktop closure (Steam, VS
  # Code, Chrome, Discord, etc.) — building it alongside holodeck-01 in a
  # single job ran the shared runner out of disk mid-build ("No space left on
  # device") even after freeing known-unused preinstalled toolchains below;
  # splitting into a matrix is the fix that doesn't need revisiting as any
  # host's closure keeps growing.
  #
  # defiant (aarch64-linux) builds on GitHub's native arm64-hosted runners
  # (ubuntu-24.04-arm) rather than cross-compiling via QEMU emulation on an
  # x86_64 runner — this repo is public, so those runners are free-tier
  # eligible. Native means no emulation tax, unlike the local cross-build
  # this repo previously relied on for defiant coverage.
  #
  # The matrix is not static: the changes job above emits one {host, runner}
  # entry per host whose toplevel derivation actually moved. An empty list
  # produces zero matrix jobs, which is what a docs-only change should cost.
  build:
    needs: [flake-check, changes]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Standard GitHub-hosted runners ship several GB of preinstalled
      # toolchains (.NET, GHC, Android SDK, Swift, Docker images, etc.) this
      # workflow never uses. /usr/local/lib/android and /usr/share/swift are
      # confirmed among the largest offenders alongside the ones already
      # removed here; docker system prune clears preloaded container images.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android /usr/share/swift /usr/local/.ghcup
          docker system prune --all --force || true

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.host }} (native)
        id: buildhost
        continue-on-error: true
        run: |
          set -o pipefail
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --no-link 2>&1 | tee /tmp/build-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.buildhost.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/build-output.txt')
              ? fs.readFileSync('/tmp/build-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: build failures (${{ matrix.host }})\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if build failed
        if: steps.buildhost.outcome == 'failure'
        run: exit 1
