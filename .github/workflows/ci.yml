name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# access-tokens authenticates the github: flake input fetcher (used for
# agenix) against api.github.com. Unauthenticated requests from shared GitHub
# Actions runner IPs get rate-limited/flaky far more often than this repo's
# own commit history suggested — dozens of runs failed on the exact same
# 503 before this was added. The default GITHUB_TOKEN is sufficient (read
# access to public repos only).
#
# Every job posts a PR comment on failure via actions/github-script's
# issues.createComment (the API PR comments actually go through). The
# default GITHUB_TOKEN is read-only unless permissions are declared here,
# so without this the comment step itself 403s and the real failure output
# never reaches the PR — masked behind an unrelated HttpError instead.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: pre-commit
        id: precommit
        continue-on-error: true
        run: |
          set -o pipefail
          nix develop -c pre-commit run --all-files 2>&1 | tee /tmp/precommit-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.precommit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/precommit-output.txt')
              ? fs.readFileSync('/tmp/precommit-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: pre-commit failures\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if pre-commit failed
        if: steps.precommit.outcome == 'failure'
        run: exit 1

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: flake check (eval only, all machines incl. aarch64)
        id: flakecheck
        continue-on-error: true
        run: |
          set -o pipefail
          nix flake check --no-build 2>&1 | tee /tmp/flakecheck-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.flakecheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/flakecheck-output.txt')
              ? fs.readFileSync('/tmp/flakecheck-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: flake check failures\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if flake check failed
        if: steps.flakecheck.outcome == 'failure'
        run: exit 1

  # Which hosts actually need rebuilding, decided by diffing each host's
  # toplevel derivation between the base and head commit. The host list itself
  # comes from the flake's nixosConfigurations at the head commit, so a newly
  # registered host is picked up here with no workflow change. fetch-depth: 0
  # is required — the script checks out the base commit to evaluate it. See
  # tools/ci_changed_hosts.py for how the decision is made and where it
  # deliberately fails safe.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      ha-reliant-changed: ${{ steps.detect-ha.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: detect hosts whose toplevel changed
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          matrix=$(python3 tools/ci_changed_hosts.py --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "matrix=$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # reliant's toplevel being unchanged (per the matrix above) already
      # implies nothing about its Home Assistant config changed either, so
      # only pay for the finer-grained package diff below when reliant is
      # actually in the matrix. tools/ci_ha_config_changed.py then decides
      # whether the change was HA-relevant at all (it might just be Traefik,
      # Bambuddy, Z-Wave, etc.) or a nixpkgs bump that touched the Home
      # Assistant package itself.
      - name: detect whether reliant's Home Assistant config changed
        id: detect-ha
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Passed through the environment, never interpolated into the script
          # below: `${{ }}` substitution happens before bash parses the line, so
          # the double quotes inside this raw JSON would close the shell string
          # early and hand jq garbage. jq then exits non-zero inside an `if`
          # condition, where `set -e` does not fire, so the failure silently
          # took the else branch and hardcoded changed=false on every reliant
          # PR (confirmed live on PR #146).
          MATRIX_JSON: ${{ steps.detect.outputs.matrix }}
        run: |
          set -euo pipefail
          if echo "$MATRIX_JSON" | jq -e 'any(.[]; .host == "reliant")' > /dev/null; then
            changed=$(python3 tools/ci_ha_config_changed.py --base "$BASE_SHA" --head "$HEAD_SHA")
          else
            echo "reliant not in the build matrix — skipping the Home Assistant package diff." >&2
            changed=false
          fi
          echo "changed=$changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Validate reliant's Nix-declared Home Assistant automations against Home
  # Assistant's own config schema. `nix flake check`/the toplevel build only
  # prove the automations are well-formed Nix that serializes to YAML — they
  # never check the Home Assistant side, so a bad trigger platform or malformed
  # action passes CI and only breaks when HA loads it.
  #
  # Scoped to actual HA changes via the changes job's ha-reliant-changed
  # output (see tools/ci_ha_config_changed.py) rather than running
  # unconditionally on every PR — most reliant changes (Traefik, Bambuddy,
  # Z-Wave, etc.) don't touch Home Assistant at all.
  ha-config-check:
    needs: [flake-check, changes]
    if: needs.changes.outputs.ha-reliant-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ha-check-hass is reliant's deployed HA package, so this job now builds
      # the full extraComponents closure (matter, zwave_js, hue, sonos,
      # apple_tv, ...). Same runner-disk reclaim the build job does below.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android /usr/share/swift /usr/local/.ghcup
          docker system prune --all --force || true

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: hass check_config (reliant automations)
        id: hacheck
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/ha_config_check.py reliant 2>&1 | tee /tmp/ha-check-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.hacheck.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/ha-check-output.txt')
              ? fs.readFileSync('/tmp/ha-check-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: Home Assistant config check failures\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if config check failed
        if: steps.hacheck.outcome == 'failure'
        run: exit 1

  # Each machine is built natively, one per job so every host gets its own
  # runner disk instead of sharing one across sequential builds. Confirmed
  # live: enterprise-d's toplevel is a full GNOME desktop closure (Steam, VS
  # Code, Chrome, Discord, etc.) — building it alongside holodeck-01 in a
  # single job ran the shared runner out of disk mid-build ("No space left on
  # device") even after freeing known-unused preinstalled toolchains below;
  # splitting into a matrix is the fix that doesn't need revisiting as any
  # host's closure keeps growing.
  #
  # aarch64-linux hosts build on GitHub's native arm64-hosted runners
  # (ubuntu-24.04-arm) rather than cross-compiling via QEMU emulation on an
  # x86_64 runner — this repo is public, so those runners are free-tier
  # eligible. Native means no emulation tax, unlike the local cross-build
  # this repo previously relied on for aarch64 coverage.
  #
  # The matrix is not static: the changes job above emits one {host, runner}
  # entry per host whose toplevel derivation actually moved, with the runner
  # picked from that host's own hostPlatform.system — nothing here keys off a
  # host name. When no host moved the list is empty, and a docs-only change
  # should cost zero build jobs — but GitHub Actions does not produce zero jobs
  # from an empty include-only matrix, it hard-errors the run with "Matrix must
  # define at least one vector" before any step executes. The job-level `if:`
  # below skips `build` outright in that case instead of relying on
  # empty-matrix semantics that do not exist.
  build:
    needs: [flake-check, changes]
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Standard GitHub-hosted runners ship several GB of preinstalled
      # toolchains (.NET, GHC, Android SDK, Swift, Docker images, etc.) this
      # workflow never uses. /usr/local/lib/android and /usr/share/swift are
      # confirmed among the largest offenders alongside the ones already
      # removed here; docker system prune clears preloaded container images.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache /usr/local/lib/android /usr/share/swift /usr/local/.ghcup
          docker system prune --all --force || true

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.host }} (native)
        id: buildhost
        continue-on-error: true
        env:
          # Same reason as MATRIX_JSON in the changes job: matrix values reach
          # `run:` scripts through the environment, not `${{ }}` substitution
          # into the script text.
          HOST: ${{ matrix.host }}
        run: |
          set -o pipefail
          nix build ".#nixosConfigurations.$HOST.config.system.build.toplevel" --no-link 2>&1 | tee /tmp/build-output.txt
          exit ${PIPESTATUS[0]}

      - name: Post failure comment
        if: steps.buildhost.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const output = fs.existsSync('/tmp/build-output.txt')
              ? fs.readFileSync('/tmp/build-output.txt', 'utf8')
              : '(no output captured)'
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## CI: build failures (${{ matrix.host }})\n\`\`\`\n${output.slice(0, 65000)}\n\`\`\``
            })

      - name: Fail if build failed
        if: steps.buildhost.outcome == 'failure'
        run: exit 1
