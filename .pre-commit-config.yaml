repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^secrets/
      - id: trailing-whitespace
        exclude: ^secrets/

  - repo: local
    hooks:
      - id: alejandra
        name: alejandra
        entry: alejandra .
        language: system
        types_or: [nix]
        pass_filenames: false

      - id: statix
        name: statix
        entry: statix check .
        language: system
        files: \.nix$
        pass_filenames: false

      - id: deadnix
        name: deadnix
        entry: deadnix --fail .
        language: system
        files: \.nix$
        pass_filenames: false

      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        language: system
        files: \.md$

      - id: no-plaintext-secrets
        name: no-plaintext-secrets
        entry: python3 ./tools/check_no_plaintext_secrets.py
        language: system
        pass_filenames: false

      - id: orphan-nix
        name: orphan-nix
        entry: python3 ./tools/check_orphan_nix.py
        language: system
        files: \.nix$
        pass_filenames: false

      - id: orphan-nix-self-test
        name: orphan-nix-self-test
        entry: python3 ./tools/test_check_orphan_nix.py
        language: system
        files: ^tools/(check_orphan_nix|test_check_orphan_nix)\.py$
        pass_filenames: false
